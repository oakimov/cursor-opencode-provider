# PR / main CI: typecheck, unit tests, and a post-build architecture scan.
# Release publish (v* tags) stays in publish.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Required check. On a pull request it tests the merge with main (the
  # checkout default), so a PR that no longer works on current main fails here.
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        run: bun install --frozen-lockfile

      # OpenCode's default interactive shell is zsh; shell-timeout's ZDOTDIR
      # injector integration test needs /bin/zsh (absent on stock ubuntu-latest).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # ubuntu-latest denies unprivileged user namespaces. The isolation
      # tests require them and fail closed when unshare cannot create one.
      # Inlined so a pull request head that predates scripts/ci-enable-userns.sh
      # can still run. Keep this probe in sync with that script for local use.
      - &userns-step
        name: Allow user namespaces
        run: |
          set -euo pipefail
          probe() {
            unshare --user --map-root-user --mount --pid --fork --mount-proc true
          }
          if probe >/dev/null 2>&1; then
            echo "user namespaces already available"
            exit 0
          fi
          sysctl_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$sysctl_path" && "$(cat "$sysctl_path")" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          clone_path=/proc/sys/kernel/unprivileged_userns_clone
          if [[ -r "$clone_path" && "$(cat "$clone_path")" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if probe >/dev/null 2>&1; then
            echo "user namespaces enabled"
            exit 0
          fi
          echo "unshare still cannot create a user, mount, and pid namespace." >&2
          probe || true
          exit 1

      - name: Typecheck
        run: bun run typecheck

      # Same commands as `bun run test:coverage`, spelled out because the
      # coverage job below checks out PR heads that may predate that script.
      - name: Test
        run: |
          bun test --coverage --coverage-reporter=lcov
          bun scripts/strip-copied-coverage.ts

      # On a push the tested commit is the one Codecov records. Pull requests
      # upload from the coverage job below.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          name: unit
          disable_search: true
          fail_ci_if_error: true

      - name: Build
        run: bun run build

      # architecture.test.ts skips dist/ when it is absent; re-run after tsc.
      - name: Architecture checks on dist
        run: bun test test/architecture.test.ts

      - name: Node HTTP/2 cleanup
        run: bun run test:node-http2

      - name: Check pricing coverage
        run: bun run check:pricing

  # codecov-action files a pull request's report under the PR head SHA, and
  # Codecov draws it on that commit's lines. Measured on the merge commit, a
  # file main has also changed reports coverage at shifted line numbers, so
  # measure the head itself.
  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - *userns-step

      # Keep in step with the test job's commands.
      - name: Test
        run: |
          bun test --coverage --coverage-reporter=lcov
          bun scripts/strip-copied-coverage.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          name: unit
          disable_search: true
          fail_ci_if_error: true
