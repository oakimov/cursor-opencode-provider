# PR / main CI: typecheck, unit tests, and a post-build architecture scan.
# Release publish (v* tags) stays in publish.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Required check. On a pull request it tests the merge with main (the
  # checkout default), so a PR that no longer works on current main fails here.
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        run: bun install --frozen-lockfile

      # OpenCode's default interactive shell is zsh; shell-timeout's ZDOTDIR
      # injector integration test needs /bin/zsh (absent on stock ubuntu-latest).
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Typecheck
        run: bun run typecheck

      # Same commands as `bun run test:coverage`, spelled out because the
      # coverage job below checks out PR heads that may predate that script.
      - name: Test
        run: |
          bun test --coverage --coverage-reporter=lcov
          bun scripts/strip-copied-coverage.ts

      # On a push the tested commit is the one Codecov records. Pull requests
      # upload from the coverage job below.
      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          name: unit
          disable_search: true
          fail_ci_if_error: true

      - name: Build
        run: bun run build

      # architecture.test.ts skips dist/ when it is absent; re-run after tsc.
      - name: Architecture checks on dist
        run: bun test test/architecture.test.ts

      - name: Node HTTP/2 cleanup
        run: bun run test:node-http2

      - name: Check pricing coverage
        run: bun run check:pricing

  # codecov-action files a pull request's report under the PR head SHA, and
  # Codecov draws it on that commit's lines. Measured on the merge commit, a
  # file main has also changed reports coverage at shifted line numbers, so
  # measure the head itself.
  coverage:
    name: Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Keep in step with the test job's commands.
      - name: Test
        run: |
          bun test --coverage --coverage-reporter=lcov
          bun scripts/strip-copied-coverage.ts

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          name: unit
          disable_search: true
          fail_ci_if_error: true
